# This is a basic workflow to help you get started with Actions

name: Deploy Conduit Application

on:
  push:
    branches:
      - c-deployment

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # hier eingefügt
      - name: Check image variables
        run: |
          echo "BACKEND_IMAGE=${{ vars.BACKEND_IMAGE }}"
          echo "FRONTEND_IMAGE=${{ vars.FRONTEND_IMAGE }}"
          echo "IMAGE_TAG=${{ vars.IMAGE_TAG }}"
# Ende

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: ghcr.io/erikogeek/conduit-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          tags: ghcr.io/erikogeek/conduit-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "SSH_PRIVATE_KEY is EMPTY"
            exit 1
          else
            echo "SSH_PRIVATE_KEY is present"
            echo "First line:"
            echo "$SSH_PRIVATE_KEY" | head -n 1
            echo "Last line:"
            echo "$SSH_PRIVATE_KEY" | tail -n 1
          fi

      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deployment_key
          chmod 600 ~/.ssh/deployment_key

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deployment_key "$SSH_USER@$SSH_HOST" << 'EOF'
            cd ~/Conduit-Deployment
            git pull origin c-deployment
            docker compose pull
            docker compose up -d
          EOF