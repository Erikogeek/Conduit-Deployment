name: Deploy Conduit Application

on:
  push:
    branches:
      - feature/c-deployment

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: ghcr.io/erikogeek/conduit-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          tags: ghcr.io/erikogeek/conduit-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
        run: |
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > deployment_key
          chmod 600 deployment_key

      - name: Copy docker-compose.yaml to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          scp -i deployment_key \
            -o StrictHostKeyChecking=no \
            docker-compose.yaml \
            "$SSH_USER@$SSH_HOST:~/Conduit-Deployment/docker-compose.yaml"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          DOTENV: ${{ secrets.DOTENV }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key_path: deployment_key
          envs: DOTENV
          script: |
            cd ~/Conduit-Deployment

            printf '%s\n' "$DOTENV" > .env

            docker compose pull
            docker compose up -d

