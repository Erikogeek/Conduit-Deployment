name: Deploy Conduit Application

on:
  push:
    branches:
      - c-deployment

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check image variables
        run: |
          echo "BACKEND_IMAGE=${{ vars.BACKEND_IMAGE }}"
          echo "FRONTEND_IMAGE=${{ vars.FRONTEND_IMAGE }}"
          echo "IMAGE_TAG=${{ vars.IMAGE_TAG }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: ${{ vars.BACKEND_IMAGE }}:${{ vars.IMAGE_TAG }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          tags: ${{ vars.FRONTEND_IMAGE }}:${{ vars.IMAGE_TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Test SSH private key
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh

          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/deployment_key
          chmod 600 ~/.ssh/deployment_key

          echo "Testing SSH private key..."
          ssh-keygen -y -f ~/.ssh/deployment_key > /dev/null

          echo "SSH private key is valid."

      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh

          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/deployment_key
          chmod 600 ~/.ssh/deployment_key

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deployment_key "$SSH_USER@$SSH_HOST" << 'EOF'
            cd ~/Conduit-Deployment
            git pull origin c-deployment
            docker compose pull
            docker compose up -d
          EOF