name: Deploy Conduit Application

on:
  push:
    branches:
      - feature/c-deployment

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ vars.BACKEND_IMAGE }}:${{ vars.IMAGE_TAG }}
            ${{ vars.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          tags: |
            ${{ vars.FRONTEND_IMAGE }}:${{ vars.IMAGE_TAG }}
            ${{ vars.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare SSH private key
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
        run: |
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > deployment_key
          chmod 600 deployment_key

      - name: Copy docker-compose.yaml to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key_path: deployment_key
          source: "docker-compose.yaml"
          target: "~/Conduit-Deployment"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key_path: deployment_key
          script: |
            cd ~/Conduit-Deployment

            printf '%s\n' '${{ secrets.DOTENV }}' > .env

            echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io \
              -u '${{ secrets.GHCR_USERNAME }}' \
              --password-stdin

            docker compose pull
            docker compose up -d